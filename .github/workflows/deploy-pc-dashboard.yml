name: Deploy Rumin PC Dashboard to GitHub Pages

on:
  push:
    branches:
      - feature/openphoneuse-agent-port
    paths:
      - "pc-agent/**"
      - ".github/workflows/deploy-pc-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp -R pc-agent/. _site/

      - name: Verify dashboard files
        run: |
          test -f _site/index.html
          echo "Dashboard entry point found: $(wc -c < _site/index.html) bytes"
          find _site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
