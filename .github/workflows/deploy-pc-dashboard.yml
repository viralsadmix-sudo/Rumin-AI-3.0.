name: Deploy Rumin PC Dashboard to GitHub Pages

on:
  push:
    branches:
      - feature/openphoneuse-agent-port
    paths:
      - "pc-agent/**"
      - ".github/workflows/deploy-pc-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp -R pc-agent/. _site/

      - name: Verify dashboard files
        run: |
          test -f _site/index.html
          echo "Dashboard entry point found: $(wc -c < _site/index.html) bytes"
          find _site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # A job rerun can leave the previous attempt's artifact in the same run.
      # deploy-pages requires exactly one artifact named github-pages.
      - name: Remove stale Pages artifacts from previous attempts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId }
            );
            for (const artifact of artifacts) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted stale artifact ${artifact.id}`);
              }
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
