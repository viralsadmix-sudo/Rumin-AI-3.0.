name: Build Rumin AI 3.0 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleRelease
      - name: Publish APK as GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: RUMIN AI 3.0 - Build ${{ github.run_number }}
          body: |
            RUMIN AI 3.0 Android APK release.
            Built automatically from the main branch.
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumin-AI-3.0-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
