name: Build Rumin Windows Companion

on:
  push:
    branches:
      - feature/openphoneuse-agent-port
    paths:
      - "pc-agent/windows-companion/**"
      - ".github/workflows/build-windows-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rumin-source
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows Companion executable
        run: dotnet publish rumin-source/pc-agent/windows-companion/RuminCompanion.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true
      - name: Upload Windows Companion
        uses: actions/upload-artifact@v4
        with:
          name: rumin-windows-companion-win-x64
          path: rumin-source/pc-agent/windows-companion/bin/Release/net8.0/win-x64/publish/
