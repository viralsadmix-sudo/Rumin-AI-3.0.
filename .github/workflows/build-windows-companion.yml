name: Build Rumin Windows Companion Installer

on:
  push:
    branches:
      - feature/openphoneuse-agent-port
    paths:
      - "pc-agent/windows-companion/**"
      - ".github/workflows/build-windows-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a safe directory name because the repository name ends with a dot.
          path: rumin-source

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows Companion
        shell: pwsh
        run: |
          dotnet publish rumin-source/pc-agent/windows-companion/RuminCompanion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishSingleFile=true `
            -o rumin-source/pc-agent/windows-companion/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (!(Test-Path "rumin-source/pc-agent/windows-companion/publish/RuminCompanion.exe")) {
            throw "RuminCompanion.exe was not produced"
          }

      - name: Add first-run instructions
        shell: pwsh
        run: |
          @'
          RUMIN AI 3.0 - WINDOWS COMPANION

          1. Install Rumin-Windows-Companion-Setup-0.6.1.exe.
          2. Launch Rumin AI Windows Companion from the Start Menu.
          3. Keep the Companion running while using the PC Agent Dashboard on this PC.
          4. Open http://127.0.0.1:47831/health on this PC. It should return status "ready".
          5. If Windows Firewall asks, allow access on Private networks only.
          6. Grant only the PC permissions you need from the local dashboard.

          This is an unsigned development installer. Windows SmartScreen may show a warning.
          This build does not provide the secure native Android-to-PC relay or OCR.
          Do not expose port 47831 to the public internet.
          '@ | Set-Content "rumin-source/pc-agent/windows-companion/publish/README-FIRST.txt" -Encoding UTF8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "rumin-source\pc-agent\windows-companion\installer\RuminCompanion.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = "rumin-source\pc-agent\windows-companion\installer\Output\Rumin-Windows-Companion-Setup-0.6.1.exe"
          if (!(Test-Path $installer)) { throw "Installer EXE was not produced" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "rumin-source\pc-agent\windows-companion\publish\*" -DestinationPath "rumin-source\pc-agent\windows-companion\Rumin-Windows-Companion-Portable-0.6.1.zip" -Force

      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: rumin-windows-companion-installer-and-portable
          path: |
            rumin-source/pc-agent/windows-companion/installer/Output/Rumin-Windows-Companion-Setup-0.6.1.exe
            rumin-source/pc-agent/windows-companion/Rumin-Windows-Companion-Portable-0.6.1.zip
          if-no-files-found: error
          retention-days: 30
