name: Build Rumin AI 3.0 Release APK

on:
  push:
    branches:
      - feat/free-first-ai-gateway
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-release-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rumin-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumin-AI-3.0-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
