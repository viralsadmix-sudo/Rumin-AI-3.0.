<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RUMIN AI</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0c1018;color:#e9edf6;font-family:'Noto Sans Bengali',system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header b{font-size:17px;letter-spacing:.14em}
.ib{background:#1a2133;border-radius:12px;width:42px;height:42px;font-size:18px}
#stage{display:flex;flex-direction:column;align-items:center;padding:4px 0 10px}
#orb{--c:#4c6ef5;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 58%,#000a);box-shadow:0 0 44px var(--c);transition:background .5s,box-shadow .5s}
#orb.on{animation:br 1.1s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.09)}}
@media(prefers-reduced-motion:reduce){#orb.on{animation:none}}
#status{margin-top:12px;font-size:14px;color:#9aa6c0;min-height:20px;text-align:center;padding:0 16px}
#log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:#3b5bdb;border-bottom-right-radius:4px}
.b{align-self:flex-start;background:#1a2133;border-bottom-left-radius:4px}
.s{align-self:center;background:none;color:#7d8aa6;font-size:13px;padding:2px}
#bar{display:flex;gap:8px;padding:10px 12px}
#txt{flex:1;background:#1a2133;border-radius:22px;padding:0 16px;height:46px}
#mic{background:#12b886;border-radius:50%;width:46px;height:46px;font-size:20px}
#mic.on{background:#e03131}
#send{background:#3b5bdb;border-radius:50%;width:46px;height:46px;font-size:18px}
#set{display:none;position:fixed;inset:0;background:#0c1018f2;padding:calc(env(safe-area-inset-top,0) + 16px) 18px 18px;overflow-y:auto;z-index:5}
#set.open{display:block}
#set h2{font-size:18px;margin-bottom:14px}
#set label{display:block;font-size:13px;color:#9aa6c0;margin:12px 0 5px}
#set input,#set select{width:100%;background:#1a2133;border-radius:10px;height:44px;padding:0 12px}
#set .row{display:flex;gap:10px;margin-top:18px}
#set .row button{flex:1;height:46px;border-radius:12px;background:#3b5bdb}
#set .row .g{background:#1a2133}
#set p{font-size:12px;color:#7d8aa6;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<header><b>RUMIN AI</b><button class="ib" id="gear" aria-label="সেটিংস">⚙</button></header>
<div id="stage"><div id="orb"></div><div id="status">মাইক চেপে কথা বলুন</div></div>
<div id="log"></div>
<div id="bar">
  <button id="mic" aria-label="ভয়েস">🎙</button>
  <input id="txt" placeholder="লিখুন বা বলুন…" autocomplete="off">
  <button id="send" aria-label="পাঠান">➤</button>
</div>
<div id="set">
  <h2>সেটিংস</h2>
  <label>Gemini API Key</label><input id="kg" type="password" autocomplete="off">
  <label>Groq API Key</label><input id="kq" type="password" autocomplete="off">
  <label>কোন AI আগে ব্যবহার হবে</label>
  <select id="kp"><option value="auto">অটো</option><option value="gemini">Gemini</option><option value="groq">Groq</option></select>
  <label>Gemini মডেল</label><input id="mg">
  <label>Groq মডেল</label><input id="mq">
  <div class="row"><button class="g" id="clr">কথোপকথন মুছুন</button><button id="save">সেভ করুন</button></div>
  <p>ফোন কন্ট্রোলের জন্য: Accessibility সেবা চালু রাখুন। Android 13+ এ সাইডলোড করা অ্যাপে App info → ⋮ → “Allow restricted settings” দিতে হতে পারে।</p>
  <div class="row"><button class="g" id="perm">অনুমতি চালু করুন</button><button class="g" id="close">বন্ধ করুন</button></div>
</div>
<script>
const $=id=>document.getElementById(id), N=window.RuminNative||null;
const LS={get:(k,d='')=>{try{return localStorage.getItem(k)||d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const MOODS={calm:'#4c6ef5',happy:'#f59f00',sad:'#6c7a9c',angry:'#e03131',thinking:'#9c36b5',listening:'#12b886'};
const DEV='আমাকে তৈরি করেছেন সাব্বির আহমেদ রুবেল। আমি রুমিন AI।';
const TOOLS=['home','back','recents','notifications','quicksettings','power','volumeup','volumedown','volumemute','volumeunmute','alarm','timer','showalarms','showtimers','call','sms','dialer','settings','wifi','bluetooth','display','sound','camera','contacts','browser','youtube','facebook','whatsapp','instagram','gmail','playstore','maps','inspect_screen','click_text','type_text','scroll_down','scroll_up'];
const ACC=['inspect_screen','click_text','type_text','scroll_down','scroll_up'];
let agentRun=false,hist=[],busy=false,live=false,pending='',counter=0,listenTimer=0;
function add(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function status(t){$('status').textContent=t}
function mood(m,on){$('orb').style.setProperty('--c',MOODS[m]||MOODS.calm);$('orb').classList.toggle('on',!!on)}
function speak(text){
  if(!text)return;
  try{if(N&&typeof N.speak==='function'){N.speak(text);return}
    if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';speechSynthesis.speak(u)}}catch(e){}
}
function stopSpeaking(){try{if(N&&typeof N.stopSpeaking==='function')N.stopSpeaking();if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
let webRec=null;
function startListening(){
  if(busy)return;
  status('শুনছি…');mood('listening',true);$('mic').classList.add('on');
  try{
    if(N&&typeof N.startSpeechRecognition==='function'){N.startSpeechRecognition();return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){webRec=new SR();webRec.lang='bn-BD';webRec.interimResults=false;
      webRec.onresult=e=>onHeard(e.results[0][0].transcript);
      webRec.onerror=()=>{status('ভয়েস শোনা যায়নি। আবার চেষ্টা করুন বা লিখুন।');idle()};
      webRec.onend=()=>{if(!busy&&!live)idle()};
      webRec.start();return}
  }catch(e){}
  status('এই ফোনে ভয়েস ইনপুট পাওয়া যায়নি। লিখে বলুন।');idle();live=false
}
function stopListening(){clearTimeout(listenTimer);try{if(webRec)webRec.abort();if(N&&typeof N.stopSpeechRecognition==='function')N.stopSpeechRecognition()}catch(e){}idle()}
function idle(){$('mic').classList.remove('on');if(!busy)mood('calm',false)}
function onHeard(t){$('mic').classList.remove('on');t=(t||'').trim();if(t)handle(t);else if(live)setTimeout(startListening,500);else idle()}
['onNativeSpeechResult','onSpeechResult','onVoiceResult','onNativeSpeech','onSpeechRecognized'].forEach(n=>{window[n]=t=>onHeard(typeof t==='string'?t:(t&&t.text)||'')});
['onNativeSpeechError','onSpeechError'].forEach(n=>{window[n]=m=>{status(m||'ভয়েস শোনা যায়নি।');idle();if(live)listenTimer=setTimeout(startListening,1500)}});
const waiters={};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function sendNative(tool,a,b,id){
  if(!N){add('ফোন কন্ট্রোল শুধু অ্যাপের ভেতরে কাজ করে।','s');return false}
  try{
    if(ACC.includes(tool)){
      if(typeof N.executeAgentTool==='function')N.executeAgentTool('accessibility:'+tool,String(a),String(b),id);
      else N.performNativeAction(tool,String(a));
    }else if(typeof N.executeAgentTool==='function')N.executeAgentTool(tool,String(a),String(b),id);
    else if(typeof N.performCommand==='function')N.performCommand(tool,String(a),String(b));
    else{add('অ্যাপের Android অংশটি আপডেট করতে হবে।','s');return false}
    return true;
  }catch(e){add('কমান্ড চালানো যায়নি: '+(e.message||'অজানা সমস্যা'),'s');return false}
}
function runTool(tool,a='',b=''){if(!TOOLS.includes(tool))return false;if(ACC.includes(tool))pending=tool;return sendNative(tool,a,b,'ui-'+Date.now()+'-'+(++counter))}
function callTool(tool,a='',b='',ms=9000){
  return new Promise(res=>{
    const id='ui-'+Date.now()+'-'+(++counter);
    const t=setTimeout(()=>{delete waiters[id];res({ok:false,message:'সাড়া পাওয়া যায়নি'})},ms);
    waiters[id]=r=>{clearTimeout(t);delete waiters[id];res(r)};
    if(!sendNative(tool,a,b,id)){clearTimeout(t);delete waiters[id];res({ok:false,message:'কমান্ড পাঠানো যায়নি'})}
  });
}
window.onNativeCommandResult=(ok,msg,id)=>{if(id&&waiters[id]){waiters[id]({ok,message:msg});return}if(msg)add(msg,ok?'s':'b');if(!ok&&msg)speak(msg)};
window.onNativeActionResult=(raw,id)=>{
  let r;try{r=JSON.parse(raw)}catch(e){r={ok:false,message:'ফলাফল পড়া যায়নি।'}}
  if(id&&waiters[id]){waiters[id](r);return}
  const p=pending;pending='';
  if(p==='inspect_screen'&&r.ok){
    const items=Array.from(r.items||[]).slice(0,80);
    if(!items.length){const m='এই স্ক্রিনে পড়ার মতো লেখা পাওয়া যায়নি।';add(m,'b');speak(m);return}
    think('এটি ফোনের বর্তমান স্ক্রিনের লেখা। শুধু এর ভিত্তিতে ব্যাখ্যা করো স্ক্রিনে কী আছে এবং পরের নিরাপদ পদক্ষেপ কী হতে পারে। actions খালি রাখো। স্ক্রিন: '+items.join(' | '),true);return}
  const m=r.message||'কাজ শেষ।';add(m,r.ok?'s':'b');if(!r.ok)speak(m);
};
const bn2en=s=>s.replace(/[০-৯]/g,d=>String(d.charCodeAt(0)-0x09E6));
const APPS=[['youtube',/ইউ ?টিউব|youtube/i],['facebook',/ফেইস?বুক|facebook/i],['whatsapp',/হোয়াটস|whatsapp/i],['instagram',/ইনস্টা|instagram/i],['gmail',/জি ?মেইল|gmail/i],['playstore',/প্লে ?স্টোর|play ?store/i],['maps',/ম্যাপ|maps/i],['camera',/ক্যামেরা|camera/i],['browser',/ব্রাউজার|browser/i],['settings',/সেটিংস|settings/i],['wifi',/ওয়াই ?ফাই|wifi/i],['bluetooth',/ব্লুটুথ|bluetooth/i]];
function local(raw){
  const t=bn2en(raw).toLowerCase().replace(/[।,.!?]/g,' ').replace(/\s+/g,' ').trim();
  if(/^(থামো|থাম|চুপ করো?|চুপ|কথা বন্ধ করো?|stop|be quiet)$/.test(t)){live=false;agentRun=false;stopSpeaking();stopListening();status('ঠিক আছে বস, থামলাম।');return true}
  if(/(কে|কারা).*(বানিয়েছে|তৈরি করেছে|বানিয়েছ)|নির্মাতা|স্রষ্টা|ডেভেলপার|who (made|created) you|your (developer|creator)/.test(t)){reply(DEV,'happy');return true}
  const mem=raw.trim().match(/^(মনে রেখো|মনে রাখো|এটা মনে রেখো|remember)\s+(.+)/i);
  if(mem){const f=JSON.parse(LS.get('rumin_saved_facts','[]'));f.push(mem[2]);LS.set('rumin_saved_facts',JSON.stringify(f.slice(-40)));reply('ঠিক আছে বস, মনে রাখলাম: '+mem[2],'happy');return true}
  if(/ভলিউম|volume/.test(t)){if(/বাড়া|বেশি|জোরে|up|increase/.test(t))return act('volumeup');if(/কম|আস্তে|down|decrease/.test(t))return act('volumedown');if(/মিউট|বন্ধ|mute/.test(t))return act('volumemute')}
  if(/^(হোমে যাও|হোম স্ক্রিনে যাও|home)$/.test(t))return act('home');
  if(/^(ব্যাক কর|ব্যাক করো|পিছনে যাও|back)$/.test(t))return act('back');
  if(/(খুল|ওপেন|open|চালু কর|চালাও|লঞ্চ)/.test(t)&&!/(স্ক্রল|scroll|সার্চ|search|খুঁজ|টাইপ|লিখ|তারপর|এরপর|প্লে|play|গান|ভিডিও|লাইক|সাবস্ক্রাইব|চাপ)/.test(t)){for(const [k,re] of APPS)if(re.test(t))return act(k)}
  return false;
}
function act(tool){runTool(tool);mood('happy',false);status('কাজটি করছি…');return true}
function system(extra=''){
  const facts=JSON.parse(LS.get('rumin_saved_facts','[]')).slice(-20);
  return \`তুমি "রুমিন AI" — বাংলাভাষী ব্যক্তিগত ভয়েস অ্যাসিস্ট্যান্ট, যে ব্যবহারকারীর Android ফোন সরাসরি নিয়ন্ত্রণ করতে পারে। তোমাকে তৈরি করেছেন সাব্বির আহমেদ রুবেল; নির্মাতা বা ডেভেলপার সম্পর্কে জানতে চাইলে এটাই বলবে।
নিয়ম:
1. ব্যবহারকারীর কথার সাথে তার আবেগও বোঝো (খুশি, মন খারাপ, রাগ, চাপ, ক্লান্তি)। সেই অনুযায়ী আন্তরিক, ছোট ও স্বাভাবিক বাংলায় উত্তর দাও। ব্যবহারকারীকে "বস" বলতে পারো।
2. ফোনের কাজ চাইলে কখনো "আমি পারি না" বা "আমি শুধু AI" বলবে না। actions-এ টুল দাও, অ্যাপ নিজেই কাজটি চালাবে।
3. শুধু একটি JSON অবজেক্ট ফেরত দাও, অন্য কোনো লেখা নয়: {"reply":"বাংলা উত্তর","emotion":"calm|happy|sad|angry|thinking","actions":[{"tool":"নাম","a":"","b":""}],"agent":false,"goal":""}
4. কাজ না থাকলে actions খালি অ্যারে।
6. ফোনে একাধিক ধাপের কাজ হলে (যেমন "ইউটিউব খুলে গান সার্চ করো", "খুলে স্ক্রল করো") "agent":true এবং "goal":"কাজের পূর্ণ বিবরণ" দাও, actions খালি রাখো। এক ধাপের কাজে agent দিও না।
টুল: \${TOOLS.join(', ')}
আর্গুমেন্ট: alarm: a=ঘণ্টা (0-23), b=মিনিট; timer: a=মিনিট; call: a=নম্বর; sms: a=নম্বর, b=বার্তা; click_text: a=যে লেখায় চাপবে; type_text: a=যা টাইপ করবে। inspect_screen দিলে স্ক্রিনের লেখা পড়া হবে।
5. কল বা SMS পাঠানোর মতো কাজে নম্বর ও উদ্দেশ্য পরিষ্কার না থাকলে আগে জিজ্ঞেস করো।
\${facts.length?'ব্যবহারকারীর বলা মনে রাখার তথ্য: '+facts.join('; '):''}
\${extra}\`;
}
async function gemini(key,model,msgs,extra){
  const r=await fetch(\`https://generativelanguage.googleapis.com/v1beta/models/\${encodeURIComponent(model)}:generateContent?key=\${encodeURIComponent(key)}\`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system(extra)}]},contents:msgs.map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]})),generationConfig:{temperature:.7,responseMimeType:'application/json'}})});
  const j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||('Gemini '+r.status));
  return j.candidates[0].content.parts.map(p=>p.text||'').join('')
}
async function groq(key,model,msgs,extra){
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,temperature:.7,response_format:{type:'json_object'},messages:[{role:'system',content:system(extra)},...msgs.map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}))]})});
  const j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||('Groq '+r.status));
  return j.choices[0].message.content
}
async function askAI(msgs=hist,extra=''){
  const kg=LS.get('rumin_gemini_key'),kq=LS.get('rumin_groq_key'),pref=LS.get('rumin_provider','auto');
  const mg=LS.get('rumin_gemini_model','gemini-2.5-flash'),mq=LS.get('rumin_groq_model','llama-3.3-70b-versatile');
  const order=[];
  if(pref==='groq'){if(kq)order.push(()=>groq(kq,mq,msgs,extra));if(kg)order.push(()=>gemini(kg,mg,msgs,extra))}
  else{if(kg)order.push(()=>gemini(kg,mg,msgs,extra));if(kq)order.push(()=>groq(kq,mq,msgs,extra))}
  if(!order.length)throw Error('সেটিংসে Gemini বা Groq API Key দিন।');
  let err;for(const f of order){try{return await f()}catch(e){err=e}}
  throw err
}
function parse(s){
  s=String(s).replace(/\`\`\`json|\`\`\`/g,'').trim();
  try{return JSON.parse(s)}catch(e){const m=s.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(_){}}return{reply:s,emotion:'calm',actions:[]}}
}
function reply(text,emotion){add(text,'b');hist.push({r:'b',t:text});mood(emotion||'calm',true);status('বলছি…');speak(text);
  const wait=Math.min(9000,900+text.length*65);
  setTimeout(()=>{mood('calm',false);status(live?'শুনছি…':'মাইক চেপে কথা বলুন');if(live&&!busy)startListening()},wait)}
async function think(text,hidden){
  if(busy)return;busy=true;status('ভাবছি…');mood('thinking',true);
  hist.push({r:'u',t:text});hist=hist.slice(-14);
  try{
    const o=parse(await askAI());
    busy=false;
    if(o.agent){reply(o.reply||'ঠিক আছে বস, কাজটা শুরু করছি।',o.emotion);setTimeout(()=>agent(o.goal||text),1200);return}
    const acts=Array.isArray(o.actions)?o.actions.filter(x=>x&&TOOLS.includes(x.tool)).slice(0,4):[];
    reply(o.reply||'ঠিক আছে বস।',o.emotion);
    acts.forEach((x,i)=>setTimeout(()=>runTool(x.tool,x.a||'',x.b||''),600+i*900));
  }catch(e){
    busy=false;const m='সমস্যা হয়েছে: '+(e.message||'অজানা');add(m,'b');status('আবার চেষ্টা করুন');mood('sad',false);hist.pop();live=false;idle();
  }
}
const OPENERS=['youtube','facebook','whatsapp','instagram','gmail','playstore','maps','camera','browser','settings','wifi','bluetooth','display','sound','contacts','dialer'];
const AGENT_RULES=\`এখন তুমি এজেন্ট মোডে আছ। প্রতিবার ঠিক একটি ধাপ বেছে নাও। শুধু JSON দাও: {"reply":"এক লাইনে কী করছ","done":false,"action":{"tool":"নাম","a":"","b":""}}। কাজ শেষ হলে done:true দাও, action বাদ দাও এবং reply-তে ফলাফল বলো। স্ক্রিনের লেখা দেখে সিদ্ধান্ত নাও; স্ক্রিনে নেই এমন বোতাম কল্পনা করবে না। click_text-এ স্ক্রিনে থাকা হুবহু লেখা দাও। ইউটিউব বা অ্যাপে কিছু খুঁজতে: আগে সার্চ আইকন বা বক্সে click_text, তারপর type_text, তারপর সার্চ বোতামে click_text। স্ক্রল করতে scroll_down বা scroll_up। একই ধাপ বারবার ব্যর্থ হলে done:true দিয়ে কারণ জানাও। call, sms, power নিজে থেকে কখনো দেবে না।\`;
async function agent(goal){
  if(agentRun)return;
  agentRun=true;live=false;busy=true;stopListening();
  const log=[];let screen='',finished=false;
  for(let n=1;n<=14&&agentRun;n++){
    status('কাজ চলছে… ধাপ '+n);mood('thinking',true);
    let o;
    try{o=parse(await askAI([{r:'u',t:'লক্ষ্য: '+goal+'\\nএ পর্যন্ত করা ধাপ: '+(log.join(' ; ')||'কিছু না')+'\\nবর্তমান স্ক্রিনের লেখা: '+(screen||'(এখনো দেখা হয়নি)')}],AGENT_RULES))}
    catch(e){add('সমস্যা: '+(e.message||'অজানা'),'b');break}
    if(!agentRun)break;
    const x=o.action;
    if(o.done||!x||!TOOLS.includes(x.tool)){finished=true;busy=false;agentRun=false;reply(o.reply||'কাজ শেষ বস।',o.emotion||'happy');return}
    if(['call','sms','power'].includes(x.tool)){finished=true;busy=false;agentRun=false;reply('বস, এই কাজটা নিজে থেকে করছি না। আলাদাভাবে স্পষ্ট করে বলুন।','calm');return}
    if(o.reply)add(o.reply,'s');
    const r=await callTool(x.tool,x.a||'',x.b||'');
    log.push(x.tool+'('+(x.a||'')+(x.b?', '+x.b:'')+') → '+(r.ok?'সফল':'ব্যর্থ: '+(r.message||'')));
    await sleep(OPENERS.includes(x.tool)?3500:1400);
    if(!agentRun)break;
    const sc=await callTool('inspect_screen','','',7000);
    screen=sc.ok?Array.from(sc.items||[]).slice(0,70).join(' | '):'(স্ক্রিন পড়া যায়নি: '+(sc.message||'')+')';
  }
  busy=false;
  if(!finished){const was=agentRun;agentRun=false;reply(was?'বস, কাজটা শেষ করতে পারিনি, তাই থামলাম।':'ঠিক আছে বস, কাজ থামালাম।',was?'sad':'calm')}
}
function handle(text){
  text=text.trim();if(!text)return;
  add(text,'u');$('txt').value='';stopSpeaking();
  if(local(text)){if(live)setTimeout(()=>{if(!busy)startListening()},1800);else idle();return}
  think(text);
}
$('send').onclick=()=>handle($('txt').value);
$('txt').onkeydown=e=>{if(e.key==='Enter')handle($('txt').value)};
$('mic').onclick=()=>{
  if(agentRun||live||$('mic').classList.contains('on')){live=false;agentRun=false;stopSpeaking();stopListening();status('ভয়েস বন্ধ');return}
  live=true;stopSpeaking();startListening()
};
$('gear').onclick=()=>{$('kg').value=LS.get('rumin_gemini_key');$('kq').value=LS.get('rumin_groq_key');$('kp').value=LS.get('rumin_provider','auto');$('mg').value=LS.get('rumin_gemini_model','gemini-2.5-flash');$('mq').value=LS.get('rumin_groq_model','llama-3.3-70b-versatile');$('set').classList.add('open')};
$('close').onclick=()=>$('set').classList.remove('open');
$('save').onclick=()=>{LS.set('rumin_gemini_key',$('kg').value.trim());LS.set('rumin_groq_key',$('kq').value.trim());LS.set('rumin_provider',$('kp').value);LS.set('rumin_gemini_model',$('mg').value.trim()||'gemini-2.5-flash');LS.set('rumin_groq_model',$('mq').value.trim()||'llama-3.3-70b-versatile');$('set').classList.remove('open');add('সেটিংস সেভ হয়েছে।','s')};
$('clr').onclick=()=>{hist=[];$('log').innerHTML='';$('set').classList.remove('open')};
$('perm').onclick=()=>{$('set').classList.remove('open');try{if(N&&typeof N.performCommand==='function')N.performCommand('requestpermissions','','','');else runTool('accessibility')}catch(e){runTool('accessibility')}};
add('আসসালামু আলাইকুম বস! আমি রুমিন AI। মাইক চেপে বলুন, যেমন: “ইউটিউব খোলো”, “ভলিউম বাড়াও”, “আমার মন খারাপ”।','b');
if(!LS.get('rumin_gemini_key')&&!LS.get('rumin_groq_key'))add('শুরু করতে ⚙ সেটিংসে API Key দিন।','s');
</script>
